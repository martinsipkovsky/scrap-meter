<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Scrap Meter</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" method="post" action="/login">
      <h1>Scrap<span style="color:var(--accent)"> Meter</span></h1>
      <p class="sub">Scrap and production figures for your plant</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autofocus required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button class="btn" style="width:100%; margin-top:18px; justify-content:center;" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
